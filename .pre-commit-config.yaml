repos:
  # --- Python: black + isort + flake8 + pydocstyle ---
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python imports)

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          - '--max-line-length=88'
          - '--ignore=E203,W503,E501,F401,E722'
          - '--exclude=.git,__pycache__,build,dist,.venv,node_modules,candidate/node_modules'

  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle

  # --- Node: prettier + eslint ---
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown, html, yaml]
        pass_filenames: true
        # Không chạy trên node_modules và thư mục candidate/node_modules
        exclude: '^(node_modules/|candidate/node_modules/)'

      - id: eslint
        name: eslint
        entry: npx eslint .
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
        exclude: '^(node_modules/|candidate/node_modules/)'

      - id: jest
        name: jest tests
        entry: npx jest --passWithNoTests
        language: system
        types: [file]
        pass_filenames: false
